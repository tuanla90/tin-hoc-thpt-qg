<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Quản trị — Ôn thi Tin học THPT</title>
<style>
  :root { --ink:#17231f; --soft:#586a62; --line:#e2e8f0; --card:#fff; --bg:#f6f8f7; --pri:#4f46e5; --ok:#16a34a; --warn:#b45309; }
  * { box-sizing:border-box; margin:0; }
  body { font:15px/1.6 system-ui,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--ink); padding:24px 16px 60px; }
  .wrap { max-width:860px; margin:0 auto; }
  h1 { font-size:22px; margin-bottom:4px; }
  .sub { color:var(--soft); font-size:13.5px; margin-bottom:22px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px; margin-bottom:18px; }
  .card h2 { font-size:16px; margin-bottom:12px; }
  .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:12px; }
  .stat { background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:10px 12px; }
  .stat b { display:block; font-size:20px; }
  .stat span { font-size:12px; color:var(--soft); }
  label { display:block; font-size:13px; font-weight:600; margin:10px 0 4px; }
  input, select { width:100%; padding:8px 10px; border:1px solid var(--line); border-radius:8px; font:inherit; }
  .row { display:flex; gap:12px; flex-wrap:wrap; } .row > div { flex:1; min-width:140px; }
  button { margin-top:14px; padding:9px 18px; border:0; border-radius:9px; background:var(--pri); color:#fff; font:600 14px/1 inherit; cursor:pointer; }
  button:disabled { opacity:.5; }
  textarea { width:100%; margin-top:12px; padding:10px; border:1px solid var(--line); border-radius:8px; font:13px/1.7 ui-monospace,Consolas,monospace; min-height:90px; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { text-align:left; padding:7px 8px; border-bottom:1px solid var(--line); white-space:nowrap; }
  td.ghi { white-space:normal; }
  .tbl-wrap { overflow-x:auto; }
  .err { color:#dc2626; font-weight:600; font-size:13.5px; margin-top:10px; }
  .tag-ok { color:var(--ok); font-weight:700; } .tag-cho { color:var(--soft); }
  a { color:var(--pri); }
</style>
</head>
<body>
<div class="wrap">
  <h1>Quản trị bán hàng</h1>
  <p class="sub">Tạo lô mã kích hoạt Premium, theo dõi mã đã bán. Trang này chỉ mở với tài khoản admin
    (đặt <code>ADMIN_EMAILS</code> trên máy chủ rồi đăng nhập bằng email đó trong <a href="/">ứng dụng</a>).</p>

  <div id="chan" class="card" hidden><b id="chanMsg"></b></div>

  <div id="noiDung" hidden>
    <div class="card">
      <h2>Số liệu nhanh</h2>
      <div class="stats" id="stats"></div>
    </div>

    <div class="card">
      <h2>Tạo lô mã</h2>
      <div class="row">
        <div><label>Số lượng mã</label><input id="soLuong" type="number" min="1" max="100" value="10"></div>
        <div><label>Thời hạn</label>
          <select id="soNgay">
            <option value="365" selected>1 năm học (365 ngày)</option>
            <option value="90">Nước rút (90 ngày)</option>
            <option value="30">Dùng thử (30 ngày)</option>
          </select></div>
        <div><label>Ghi chú lô (đợt bán, kênh…)</label><input id="ghiChu" type="text" maxlength="200" placeholder="vd: đợt 1 nhóm hạt giống"></div>
      </div>
      <button id="taoBtn">Tạo mã</button>
      <div class="err" id="taoErr"></div>
      <textarea id="ketQua" hidden readonly title="Danh sách mã vừa tạo — bôi đen để copy"></textarea>
    </div>

    <div class="card">
      <h2>Mã gần đây</h2>
      <div class="tbl-wrap"><table id="bang"><thead>
        <tr><th>Mã</th><th>Hạn (ngày)</th><th>Trạng thái</th><th>Người kích hoạt</th><th>Hết hạn</th><th>Ghi chú</th></tr>
      </thead><tbody></tbody></table></div>
    </div>
  </div>
</div>

<script>
(function () {
  function api(path, method, body) {
    return fetch("/api" + path, {
      method: method || "GET",
      headers: body ? { "Content-Type": "application/json" } : undefined,
      body: body ? JSON.stringify(body) : undefined,
      credentials: "same-origin",
    }).then(function (res) {
      return res.json().catch(function () { return {}; }).then(function (d) {
        if (!res.ok) { var e = new Error(d.error || ("Lỗi " + res.status)); e.status = res.status; throw e; }
        return d;
      });
    });
  }
  function ngay(s) { return s ? new Date(s).toLocaleDateString("vi-VN") : ""; }

  function veStats() {
    return api("/admin/stats").then(function (d) {
      document.getElementById("stats").innerHTML =
        '<div class="stat"><b>' + d.users + "</b><span>tài khoản</span></div>" +
        '<div class="stat"><b>' + d.attempts + "</b><span>lượt làm bài đã lưu</span></div>" +
        '<div class="stat"><b>' + d.maDaTao + "</b><span>mã đã tạo</span></div>" +
        '<div class="stat"><b>' + d.maDaKichHoat + "</b><span>mã đã kích hoạt</span></div>" +
        '<div class="stat"><b>' + d.premiumConHan + "</b><span>Premium còn hạn</span></div>";
    });
  }
  function veBang() {
    return api("/admin/licenses").then(function (d) {
      document.querySelector("#bang tbody").innerHTML = (d.licenses || []).map(function (x) {
        return "<tr><td><code>" + x.code + "</code></td><td>" + x.soNgay + "</td>" +
          "<td>" + (x.nguoiDung ? '<span class="tag-ok">đã dùng</span>' : '<span class="tag-cho">chưa dùng</span>') + "</td>" +
          "<td>" + (x.nguoiDung || "") + "</td><td>" + ngay(x.hetHan) + "</td>" +
          '<td class="ghi">' + (x.note || "") + "</td></tr>";
      }).join("");
    });
  }

  document.getElementById("taoBtn").onclick = function () {
    var btn = this, err = document.getElementById("taoErr"), ra = document.getElementById("ketQua");
    err.textContent = ""; btn.disabled = true;
    api("/admin/licenses", "POST", {
      soLuong: Number(document.getElementById("soLuong").value),
      soNgay: Number(document.getElementById("soNgay").value),
      ghiChu: document.getElementById("ghiChu").value,
    }).then(function (d) {
      ra.hidden = false;
      ra.value = d.codes.join("\n");
      ra.style.height = Math.min(320, 30 + d.codes.length * 22) + "px";
      return Promise.all([veStats(), veBang()]);
    }).catch(function (e) { err.textContent = e.message; })
      .then(function () { btn.disabled = false; });
  };

  api("/admin/stats").then(function () {
    document.getElementById("noiDung").hidden = false;
    return Promise.all([veStats(), veBang()]);
  }).catch(function (e) {
    var c = document.getElementById("chan");
    c.hidden = false;
    document.getElementById("chanMsg").textContent =
      e.status === 401 ? "Bạn chưa đăng nhập — mở ứng dụng, đăng nhập bằng tài khoản admin rồi quay lại trang này."
      : e.status === 403 ? "Tài khoản của bạn không phải admin."
      : "Không nối được máy chủ: " + e.message;
  });
})();
</script>
</body>
</html>
