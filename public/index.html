  <!-- Cài ra màn hình chính. apple-touch-icon phải là PNG và nền tràn kín khung

<body>
  <!-- ===================== THANH TIÊU ĐỀ ===================== -->
  <header class="topbar">
    <div class="brand" id="homeLink" role="button" tabindex="0" title="Về trang chủ">
      <span class="brand-logo" data-ic="monitor" data-ic-size="26"></span>
      <div class="brand-text">
        <strong>Ôn thi Tin học</strong>
        <small>THPT Quốc gia 2025</small>
      </div>
    </div>
    <nav class="topnav">
      <button class="nav-btn" data-nav="home" title="Trang chủ"><span class="nav-ic" data-ic="home"></span><span class="nav-label">Trang chủ</span></button>
      <button class="nav-btn" data-nav="onNhanh" title="Ôn nhanh"><span class="nav-ic" data-ic="zap"></span><span class="nav-label">Ôn nhanh</span></button>
      <button class="nav-btn" data-nav="vocab" title="Từ vựng"><span class="nav-ic" data-ic="book"></span><span class="nav-label">Từ vựng</span></button>

      <button class="nav-btn" data-nav="achievements" title="Thành tựu"><span class="nav-ic" data-ic="trophy"></span><span class="nav-label">Thành tựu</span></button>
      <!-- Khối tài khoản: gộp Hồ sơ / Tài khoản / âm thanh / giao diện vào một
           menu thả xuống kiểu SaaS thay vì 4 nút rời. Mở/đóng do initUserMenu()
           trong app.js; nội dung (avatar, tên, gói) do veUserMenu() trong
           account.js — hai tệp cùng lo một khối vì trigger phải hoạt động được
           ngay cả khi account.js lỗi, còn nội dung thì cần dữ liệu tài khoản. -->
      <div class="um-wrap" id="umWrap">
        <button class="um-trigger" id="umTrigger" type="button" aria-haspopup="true" aria-expanded="false" title="Tài khoản và cài đặt">
          <span class="um-avatar" id="umAvatar"></span>
          <span class="um-name" id="umName">Khách</span>
          <span class="um-chev" data-ic="chevdown" data-ic-size="14"></span>
        </button>
        <div class="um-menu" id="umMenu" hidden>
          <div class="um-head">
            <span class="um-head-ava" id="umHeadAvatar"></span>
            <div class="um-head-txt">
              <b id="umHeadName">Khách</b>
              <small id="umHeadSub"></small>
            </div>
          </div>
          <button class="nav-btn um-item" data-nav="profile"><span class="um-item-ic" data-ic="user"></span>Hồ sơ</button>
          <button class="nav-btn um-item" data-nav="account"><span class="um-item-ic" data-ic="globe"></span>Tài khoản</button>
          <div class="um-sep"></div>
          <div class="um-row" id="umRowSound">
            <span class="um-row-txt">Âm thanh</span>
            <button class="um-switch" id="amToggle" type="button" title="Tắt âm thanh" aria-pressed="true"></button>
          </div>
          <div class="um-row" id="umRowTheme">
            <span class="um-row-txt">Giao diện tối</span>
            <button class="um-switch" id="themeToggle" type="button" title="Chế độ sáng/tối"></button>
          </div>
          <div class="um-sep" id="umSepOut" hidden></div>
          <button class="um-item" id="umSwitchBtn" type="button" hidden><span class="um-item-ic" data-ic="refresh"></span>Đổi hồ sơ</button>
          <button class="um-item um-danger" id="umAuthBtn" type="button" hidden>Đăng xuất</button>
        </div>
      </div>
    </nav>
  </header>

  <!-- ===================== NỘI DUNG CHÍNH ===================== -->
  <main id="app" class="app-main">

    <span> • <a href="/bai">Ôn tập theo bài</a> • <a href="/">Giới thiệu</a></span>

        <button class="btn btn-ghost" id="modalCancel">Hủy</button>
        <button class="btn btn-primary" id="modalOk">Đồng ý</button>
      </div>
    </div>
  </div>

  <!-- Lưới an toàn cuối cùng: nếu chính app.js (hoặc một tệp dữ liệu) không tải
       được thì không hàm nào của ứng dụng chạy, và học sinh chỉ thấy trang trắng.
       Đoạn nội tuyến này không phụ thuộc tệp ngoài nào nên luôn chạy được. -->
  <script>
    setTimeout(function () {
      var m = document.getElementById("app");
      if (window.__appDaVe || !m || m.children.length) return;
      m.innerHTML =
        '<div style="max-width:520px;margin:56px auto;text-align:center;padding:0 20px;font-family:system-ui,sans-serif">' +
        '<div style="font-size:44px;margin-bottom:8px">😵&zwj;💫</div>' +
        '<h2 style="margin:0 0 10px">Trang chưa tải xong</h2>' +
        '<p style="color:#64748b;line-height:1.6;margin:0 0 20px">Một phần dữ liệu bài học chưa tải được — ' +
        'thường do mạng chập chờn. Bấm nút dưới để tải lại, tiến độ của em vẫn còn nguyên.</p>' +
        '<button onclick="location.reload()" style="padding:12px 22px;border:0;border-radius:10px;' +
        'background:#4f46e5;color:#fff;font-size:15px;font-weight:600;cursor:pointer">Tải lại trang</button></div>';
    }, 8000);
  </script>
