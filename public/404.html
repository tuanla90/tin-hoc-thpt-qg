<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Không tìm thấy trang — Ôn thi Tin học THPT</title>
  <meta name="robots" content="noindex, follow" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💻</text></svg>" />
  <style>
    /* Trang này cố tình không dùng styles.css hay JS: nó phải hiện được kể cả khi
       phần còn lại của web đang hỏng. */
    :root { color-scheme: light dark; }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
           font-family: "Segoe UI", system-ui, -apple-system, sans-serif; background: #f8fafc; color: #0f172a; }
    .box { max-width: 520px; padding: 32px 24px; text-align: center; }
    h1 { font-size: 64px; margin: 0; letter-spacing: -.03em; color: #4f46e5; }
    h2 { font-size: 21px; margin: 8px 0 12px; }
    p { line-height: 1.6; color: #475569; margin: 0 0 24px; }
    .links { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    a { display: inline-block; padding: 12px 20px; border-radius: 10px; text-decoration: none; font-weight: 600; }
    .primary { background: #4f46e5; color: #fff; }
    .ghost { border: 1px solid #cbd5e1; color: #0f172a; }
    @media (prefers-color-scheme: dark) {
      body { background: #0f172a; color: #e2e8f0; }
      p { color: #94a3b8; }
      .ghost { border-color: #334155; color: #e2e8f0; }
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>404</h1>
    <h2>Không tìm thấy trang này</h2>
    <p>Đường dẫn có thể đã cũ hoặc bị gõ sai. Bạn thử vào lại trang chính hoặc xem danh sách 119 bài ôn tập nhé.</p>
    <div class="links">
      <a class="primary" href="/">Vào ứng dụng</a>
      <a class="ghost" href="/bai">Ôn tập theo bài</a>
      <a class="ghost" href="/landing.html">Giới thiệu</a>
    </div>
  </div>
</body>
</html>
